<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noorie CRM — Customer Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F3A34;
    --ink-deep:#152722;
    --paper:#F6F2E9;
    --paper-line:#DCD4C0;
    --text:#2B2620;
    --text-soft:#6B6455;
    --gold:#C99A3E;
    --gold-deep:#A87F2C;
    --sage:#8FA69B;
    --whatsapp:#25D366;
    --whatsapp-deep:#1DA851;
    --danger:#B4543A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(201,154,62,0.08), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(143,166,155,0.10), transparent 45%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:32px 16px 64px;
    display:flex;
    justify-content:center;
  }
  .app{ width:100%; max-width:440px; }

  header.top{
    text-align:center;
    margin-bottom:24px;
    color:var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header.top .logo{
    width:56px; height:56px;
    border-radius:50%;
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
    overflow:hidden;
    border:2px solid var(--gold);
  }
  header.top .logo img{ width:100%; height:100%; object-fit:cover; }
  header.top .logo span{
    font-family:'Zilla Slab', serif;
    font-weight:700;
    font-size:20px;
    color:var(--ink);
  }
  header.top .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
  }
  header.top h1{
    font-family:'Zilla Slab', serif;
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:0.01em;
  }
  header.top p{
    font-size:13px;
    color:var(--sage);
    margin:6px 0 0;
  }

  .card{
    background:var(--paper);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:0 18px 40px rgba(0,0,0,0.28);
    margin-bottom:16px;
  }

  .search-card h2{
    font-family:'Zilla Slab', serif;
    font-size:16px;
    margin:0 0 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .search-card h2 .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }

  .btn{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:8px;
    padding:12px 16px;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn:disabled{ opacity:0.6; cursor:default; }
  .btn-primary{ background:var(--ink); color:var(--paper); width:100%; }
  .btn-primary:hover{ background:var(--ink-deep); }
  .btn-gold{ background:var(--gold); color:var(--ink-deep); width:100%; }
  .btn-gold:hover{ background:var(--gold-deep); }
  .btn-whatsapp{
    background:var(--whatsapp); color:#fff; width:100%;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-whatsapp:hover{ background:var(--whatsapp-deep); }
  .btn-ghost{
    background:transparent; color:var(--text-soft);
    border:1px solid var(--paper-line); width:100%;
  }
  .btn-row{ display:flex; gap:8px; margin-top:8px; }
  .btn-row .btn{ flex:1; font-size:12.5px; padding:10px 8px; }

  .manual-row{ display:flex; gap:8px; }
  .manual-row input{
    flex:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--paper-line);
    background:#fff;
    color:var(--text);
  }
  .manual-row input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .manual-row button{ padding:10px 14px; width:auto !important; flex-shrink:0; }

  .hint{
    margin-top:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--text-soft);
  }

  .receipt{ display:none; }
  .receipt.active{ display:block; }

  .cust-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    border-bottom:1.5px dashed var(--paper-line);
    padding-bottom:14px;
    margin-bottom:14px;
  }
  .cust-head h2{ font-family:'Zilla Slab', serif; font-size:20px; margin:0 0 2px; }
  .cust-head .code{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--text-soft); }
  .vip-pill{
    background:var(--ink); color:var(--gold);
    font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600;
    padding:6px 10px; border-radius:20px; white-space:nowrap;
  }
  .vip-pill.inactive{ background:var(--paper-line); color:var(--text-soft); }

  .hist-label{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--text-soft); margin-bottom:8px;
  }
  .ledger-line{
    display:flex; align-items:baseline; gap:6px; padding:6px 0;
    font-family:'IBM Plex Mono', monospace; font-size:13px;
  }
  .ledger-line .date{ color:var(--text-soft); flex-shrink:0; }
  .ledger-line .fill{ flex:1; border-bottom:1px dotted var(--paper-line); transform:translateY(-3px); }
  .ledger-line .amt{ font-weight:600; flex-shrink:0; }
  .empty-hist{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--text-soft); padding:8px 0; }

  .discount-note{
    margin-top:14px; background:#fff; border:1px solid var(--paper-line);
    border-radius:8px; padding:10px 12px; font-size:12.5px; color:var(--text-soft);
    display:none;
  }
  .discount-note.active{ display:block; border-color:var(--gold); background:#FBF3E1; }
  .discount-note strong{ color:var(--text); }

  .add-form{ margin-top:16px; border-top:1.5px dashed var(--paper-line); padding-top:14px; }
  .add-form h3{ font-family:'Zilla Slab', serif; font-size:15px; margin:0 0 10px; }
  .add-form label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:10px;
    letter-spacing:0.1em; text-transform:uppercase; color:var(--text-soft); margin-bottom:5px;
  }
  .amt-row{ display:flex; gap:8px; }
  .amt-row input{
    flex:1; font-family:'IBM Plex Mono', monospace; font-size:14px;
    padding:10px 12px; border-radius:8px; border:1px solid var(--paper-line); background:#fff; color:var(--text);
  }
  .name-row input{
    width:100%; font-family:'Inter',sans-serif; font-size:14px;
    padding:9px 10px; border-radius:8px; border:1px solid var(--paper-line); background:#fff;
    margin-bottom:10px;
  }

  .whatsapp-section{ margin-top:16px; border-top:1.5px dashed var(--paper-line); padding-top:14px; }
  .whatsapp-section h3{ font-family:'Zilla Slab', serif; font-size:15px; margin:0 0 10px; }

  .toast{
    display:none; margin-top:10px; font-family:'IBM Plex Mono', monospace;
    font-size:12px; padding:8px 10px; border-radius:6px; background:var(--ink); color:var(--paper);
  }
  .toast.show{ display:block; }

  .switch-btn{
    background:none; border:none; color:var(--sage); font-family:'IBM Plex Mono', monospace;
    font-size:12px; cursor:pointer; padding:8px 0; text-align:center; width:100%;
  }
  .switch-btn:hover{ color:var(--gold); }

  .disclaim{
    text-align:center; font-size:11px; color:var(--sage); opacity:0.7;
    font-family:'IBM Plex Mono', monospace; margin-top:8px; line-height:1.6;
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="logo">
      <!-- Replace with <img src="logo.png" alt="Noorie"> once you have your logo file -->
      <span>N</span>
    </div>
    <div class="eyebrow">Noorie Enterprise</div>
    <h1>Customer Ledger</h1>
    <p>Search by phone number</p>
  </header>

  <div class="card search-card" id="searchCard">
    <h2><span class="dot"></span>Find customer</h2>
    <div class="manual-row">
      <input type="tel" id="phoneInput" placeholder="10-digit phone number" inputmode="numeric" maxlength="10" />
      <button class="btn btn-primary" id="lookupBtn">Search</button>
    </div>
    <div class="hint">If the number isn't found, you'll be asked to add the customer.</div>
  </div>

  <div class="card receipt" id="receiptCard">
    <div class="cust-head">
      <div style="flex:1;">
        <h2 id="custName">—</h2>
        <div class="code" id="custPhone">—</div>
        <div id="newCustRow" style="display:none; margin-top:8px;">
          <label style="display:block; font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-soft); margin-bottom:5px;">New customer — enter name</label>
          <input type="text" id="newCustName" class="name-row" placeholder="e.g. Priya Shah" style="margin-bottom:0;" />
        </div>
      </div>
    </div>

    <div class="hist-label">Purchase history</div>
    <div id="historyList"></div>

    <div class="add-form">
      <h3>Add today's purchase</h3>
      <label for="newAmt">Amount (₹)</label>
      <div class="amt-row">
        <input type="number" id="newAmt" placeholder="0" min="0" step="1" />
        <button class="btn btn-gold" id="addPurchaseBtn" style="width:auto;">Add</button>
      </div>
      <div class="discount-note" id="discountNote"></div>
    </div>

    <div class="whatsapp-section">
      <h3>WhatsApp</h3>
      <button class="btn btn-whatsapp" id="waChatBtn">Open chat with customer</button>
      <div class="btn-row">
        <button class="btn btn-ghost" id="waBillBtn">Send bill copy</button>
        <button class="btn btn-ghost" id="waRewardBtn">Send discount status</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <button class="switch-btn" id="scanAnotherBtn">← Search a different customer</button>
  </div>

  <footer class="disclaim">
    Discount: ₹600–₹1900 purchase = 10% off. Above ₹1900 = 15% off.
  </footer>

</div>

<script>
  const DISCOUNT_MIN_AMOUNT = 600;    // below this, no discount
  const DISCOUNT_TIER_CUTOFF = 1900;  // above this, higher tier
  const DISCOUNT_LOW = 10;            // % for DISCOUNT_MIN_AMOUNT–DISCOUNT_TIER_CUTOFF
  const DISCOUNT_HIGH = 15;           // % above DISCOUNT_TIER_CUTOFF

  const customers = {}; // client-side cache for this session

  async function fetchCustomer(phone){
    const res = await fetch(`/api/customer?phone=${encodeURIComponent(phone)}`);
    if(!res.ok) throw new Error("lookup failed");
    const data = await res.json();
    customers[phone] = data;
    return data;
  }

  async function postPurchase(phone, amount, name){
    const res = await fetch('/api/purchase', {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, amount, name })
    });
    if(!res.ok){
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || "save failed");
    }
    const data = await res.json();
    customers[phone] = { ...data, isNew: false };
    return customers[phone];
  }

  let currentPhone = null;

  const searchCard = document.getElementById('searchCard');
  const receiptCard = document.getElementById('receiptCard');
  const phoneInput = document.getElementById('phoneInput');
  const lookupBtn = document.getElementById('lookupBtn');
  const scanAnotherBtn = document.getElementById('scanAnotherBtn');
  const addPurchaseBtn = document.getElementById('addPurchaseBtn');
  const newAmt = document.getElementById('newAmt');
  const toast = document.getElementById('toast');
  const waChatBtn = document.getElementById('waChatBtn');
  const waBillBtn = document.getElementById('waBillBtn');
  const waRewardBtn = document.getElementById('waRewardBtn');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3500);
  }

  function fmtDate(d){
    // SQLite's datetime('now') returns "YYYY-MM-DD HH:MM:SS" (space-separated,
    // no timezone). Normalize to a proper ISO string before parsing.
    let iso = d.includes('T') ? d : d.replace(' ', 'T');
    if(!iso.endsWith('Z') && !/[+-]\d\d:\d\d$/.test(iso)) iso += 'Z';
    const dt = new Date(iso);
    if(isNaN(dt.getTime())) return d; // fallback: show raw value rather than "Invalid Date"
    return dt.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  }

  function fmtAmt(n){ return "₹" + n.toLocaleString('en-IN'); }

  // Normalize to a WhatsApp-ready international number (assumes India +91
  // unless the customer's stored phone already has a country code length)
  function toWaNumber(phone){
    const digits = phone.replace(/\D/g, '');
    if(digits.length === 10) return "91" + digits;
    return digits;
  }

  function discountPercentFor(amount){
    if(!amount || amount < DISCOUNT_MIN_AMOUNT) return 0;
    return amount > DISCOUNT_TIER_CUTOFF ? DISCOUNT_HIGH : DISCOUNT_LOW;
  }

  function renderCustomer(phone){
    const cust = customers[phone];
    const newRow = document.getElementById('newCustRow');

    if(cust.isNew){
      document.getElementById('custName').textContent = "New customer";
      newRow.style.display = "block";
    } else {
      document.getElementById('custName').textContent = cust.name;
      newRow.style.display = "none";
    }
    document.getElementById('custPhone').textContent = phone;

    const listEl = document.getElementById('historyList');
    listEl.innerHTML = "";
    if(cust.history.length === 0){
      listEl.innerHTML = '<div class="empty-hist">No purchases yet — this will be their first.</div>';
    } else {
      [...cust.history].reverse().forEach(p => {
        const row = document.createElement('div');
        row.className = "ledger-line";
        row.innerHTML = `<span class="date">${fmtDate(p.date)}</span><span class="fill"></span><span class="amt">${fmtAmt(p.amount)}</span>`;
        listEl.appendChild(row);
      });
    }

    updateDiscountPreview();
  }

  function updateDiscountPreview(){
    const noteEl = document.getElementById('discountNote');
    const amount = parseFloat(newAmt.value);
    const pct = discountPercentFor(amount);

    if(!pct){
      noteEl.classList.remove('active');
      noteEl.innerHTML = "";
      return;
    }

    const discountedTotal = amount - (amount * pct / 100);
    noteEl.classList.add('active');
    noteEl.innerHTML = `<strong>${pct}% discount applies.</strong> ₹${amount.toLocaleString('en-IN')} → ${fmtAmt(Math.round(discountedTotal))} after discount. (Apply manually at billing — this amount isn't auto-saved.)`;
  }

  async function showCustomer(phone){
    currentPhone = phone;
    searchCard.style.display = "none";
    receiptCard.classList.add('active');
    toast.classList.remove('show');
    newAmt.value = "";

    document.getElementById('custName').textContent = "Loading…";
    document.getElementById('historyList').innerHTML = "";

    try {
      await fetchCustomer(phone);
      renderCustomer(phone);
    } catch (err) {
      showToast("Couldn't reach the server — try again.");
    }
  }

  function backToSearch(){
    receiptCard.classList.remove('active');
    searchCard.style.display = "block";
    phoneInput.value = "";
    currentPhone = null;
  }

  lookupBtn.addEventListener('click', () => {
    const phone = phoneInput.value.trim();
    if(phone) showCustomer(phone);
  });
  phoneInput.addEventListener('keydown', (e) => {
    if(e.key === "Enter"){ lookupBtn.click(); }
  });

  newAmt.addEventListener('input', updateDiscountPreview);

  addPurchaseBtn.addEventListener('click', async () => {
    const amt = parseFloat(newAmt.value);
    if(!amt || amt <= 0){
      showToast("Enter a valid amount first.");
      return;
    }

    const cust = customers[currentPhone];
    let nameToSend = cust?.name;
    if(cust?.isNew){
      const typedName = document.getElementById('newCustName').value.trim();
      if(!typedName){
        showToast("Enter the customer's name first.");
        return;
      }
      nameToSend = typedName;
    }

    addPurchaseBtn.disabled = true;
    addPurchaseBtn.textContent = "Saving…";
    try {
      await postPurchase(currentPhone, amt, nameToSend);
      renderCustomer(currentPhone);
      newAmt.value = "";
      showToast("Purchase added — VIP status updated.");
    } catch (err) {
      showToast("Couldn't save — " + err.message);
    } finally {
      addPurchaseBtn.disabled = false;
      addPurchaseBtn.textContent = "Add";
    }
  });

  waChatBtn.addEventListener('click', () => {
    if(!currentPhone) return;
    window.open(`https://wa.me/${toWaNumber(currentPhone)}`, '_blank');
  });

  waBillBtn.addEventListener('click', () => {
    const cust = customers[currentPhone];
    if(!cust || cust.history.length === 0){
      showToast("No purchases to send yet.");
      return;
    }
    const last = cust.history[cust.history.length - 1];
    const pct = discountPercentFor(last.amount);
    const msg = `Hi ${cust.name || ''}, thank you for shopping at Noorie Enterprise!\n\nYour bill: ${fmtAmt(last.amount)} on ${fmtDate(last.date)}${pct ? `\n${pct}% discount applied — ${fmtAmt(Math.round(last.amount - last.amount * pct / 100))} after discount.` : ''}\n\nWe look forward to serving you again.`;
    window.open(`https://wa.me/${toWaNumber(currentPhone)}?text=${encodeURIComponent(msg)}`, '_blank');
  });

  waRewardBtn.addEventListener('click', () => {
    const cust = customers[currentPhone];
    if(!cust || cust.history.length === 0){
      showToast("No purchases yet to check discount status.");
      return;
    }
    const last = cust.history[cust.history.length - 1];
    const pct = discountPercentFor(last.amount);
    const msg = pct
      ? `Hi ${cust.name || ''}, good news from Noorie Enterprise!\n\nYour purchase of ${fmtAmt(last.amount)} qualifies for a ${pct}% discount.\n\nWe look forward to seeing you again!`
      : `Hi ${cust.name || ''}, here's our discount policy at Noorie Enterprise:\n\n₹${DISCOUNT_MIN_AMOUNT}–₹${DISCOUNT_TIER_CUTOFF}: ${DISCOUNT_LOW}% off\nAbove ₹${DISCOUNT_TIER_CUTOFF}: ${DISCOUNT_HIGH}% off\n\nApplies automatically on qualifying purchases!`;
    window.open(`https://wa.me/${toWaNumber(currentPhone)}?text=${encodeURIComponent(msg)}`, '_blank');
  });

  scanAnotherBtn.addEventListener('click', backToSearch);
</script>

</body>
</html>
